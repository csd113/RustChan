name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust 1.91 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality

      - name: Check formatting
        run: cargo +1.91.0 fmt --all --check

      - name: Run Rust 1.91 check
        run: cargo +1.91.0 check --locked --workspace --all-targets --all-features

      - name: Run Rust 1.91 Clippy policy
        run: cargo +1.91.0 clippy --locked --workspace --all-targets --all-features

      - name: Run stable check
        run: cargo +stable check --locked --workspace --all-targets --all-features

      - name: Run stable Clippy policy
        run: cargo +stable clippy --locked --workspace --all-targets --all-features

      - name: Audit stable Clippy nursery lints
        run: >-
          cargo +stable clippy --locked --workspace --all-targets --all-features --
          -A warnings
          -W clippy::nursery

  feature-matrix:
    name: Features (${{ matrix.toolchain }}, ${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: 1.91.0
            name: default
            args: ""
          - toolchain: 1.91.0
            name: no-default
            args: --no-default-features
          - toolchain: 1.91.0
            name: acme-only
            args: --no-default-features --features tls-acme
          - toolchain: stable
            name: default
            args: ""
          - toolchain: stable
            name: no-default
            args: --no-default-features
          - toolchain: stable
            name: acme-only
            args: --no-default-features --features tls-acme

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: feature-matrix
          key: ${{ matrix.toolchain }}-${{ matrix.name }}

      - name: Check feature configuration
        run: >-
          cargo +${{ matrix.toolchain }} check
          --locked --workspace --all-targets ${{ matrix.args }}

      - name: Run Clippy for feature configuration
        run: >-
          cargo +${{ matrix.toolchain }} clippy
          --locked --workspace --all-targets ${{ matrix.args }}

  test:
    name: Tests (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        toolchain: [1.91.0, stable]

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          key: ${{ matrix.toolchain }}

      - name: Run tests
        run: >-
          cargo +${{ matrix.toolchain }} test
          --locked --workspace --all-targets --all-features

      - name: Run documentation tests
        run: >-
          cargo +${{ matrix.toolchain }} test
          --locked --workspace --doc --all-features

  platform-smoke:
    name: Platform smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: platform-smoke
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Build
        run: cargo build --locked --all-features --target ${{ matrix.target }} --verbose

name: CI

on:
  pull_request:
    branches: [main, master, indev]
  push:
    branches: [main, master, indev]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes must not cancel manually requested CI validation.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep local tooling out of Git
        run: python3 tools/check_local_tooling.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: quality

      - name: Install cargo-deny
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run focused regressions
        run: cargo test --locked --workspace --all-features --no-fail-fast

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Enforce locked dependency policy
        run: cargo deny --locked check

  platform-smoke:
    name: Platform smoke (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: macos-apple-silicon
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: platform-smoke
          key: ${{ matrix.target }}
          cache-bin: false

      - name: Build
        run: cargo build --locked --all-features --target ${{ matrix.target }} --verbose

      - name: Run focused regressions natively
        run: cargo test --locked --workspace --all-features --no-fail-fast --target ${{ matrix.target }}

  tests:
    name: Tests
    if: ${{ always() }}
    needs: platform-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every native regression job to pass
        env:
          PLATFORM_RESULT: ${{ needs.platform-smoke.result }}
        run: test "$PLATFORM_RESULT" = success

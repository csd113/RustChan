name: Dependency Audit

on:
  pull_request:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  push:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.1

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Install cargo-deny
        uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Verify cargo audit scans dependencies
        shell: bash
        run: |
          audit_report="$(cargo audit --file Cargo.lock --format json || true)"
          dependency_count="$(
            jq --exit-status --raw-output \
              '.lockfile["dependency-count"] | select(type == "number" and . > 0)' \
              <<<"${audit_report}"
          )"
          echo "cargo-audit scanned ${dependency_count} dependencies"

      - name: Run cargo audit
        # RUSTSEC-2026-0387 is an explicit operator-approved release exception.
        run: cargo audit --no-fetch --deny unsound --deny yanked --file Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387

      - name: Enforce dependency policy
        run: cargo deny --locked check

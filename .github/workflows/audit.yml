name: Dependency Audit

on:
  pull_request:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  push:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@aa7e9e10a2fd43c88f1948b7de4af2f4efd56483 # cargo-audit
        with:
          tool: cargo-audit@0.22.1
          fallback: none

      - name: Install cargo-deny
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
        with:
          tool: cargo-deny@0.19.0
          fallback: none

      - name: Verify cargo audit scans dependencies
        shell: bash
        run: |
          audit_report="$(cargo audit --file Cargo.lock --format json || true)"
          dependency_count="$(
            jq --exit-status --raw-output \
              '.lockfile["dependency-count"] | select(type == "number" and . > 0)' \
              <<<"${audit_report}"
          )"
          echo "cargo-audit scanned ${dependency_count} dependencies"

      - name: Run cargo audit
        run: cargo audit --no-fetch --deny unsound --deny yanked --file Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Enforce dependency policy
        run: cargo deny --locked check

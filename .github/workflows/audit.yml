name: Dependency Audit

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Verify cargo audit scans dependencies
        shell: bash
        run: |
          audit_report="$(cargo audit --file Cargo.lock --format json || true)"
          dependency_count="$(
            jq --exit-status --raw-output \
              '.lockfile["dependency-count"] | select(type == "number" and . > 0)' \
              <<<"${audit_report}"
          )"
          echo "cargo-audit scanned ${dependency_count} dependencies"

      - name: Run cargo audit
        run: cargo audit --no-fetch --deny unsound --file Cargo.lock --ignore RUSTSEC-2023-0071

name: Dependency Audit

on:
  pull_request:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  push:
    branches: [main, master]
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/audit.yml
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit

      - name: Install cargo-audit
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Install cargo-deny
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Verify cargo audit scans dependencies
        shell: bash
        run: |
          audit_report="$(cargo audit --file Cargo.lock --format json || true)"
          dependency_count="$(
            jq --exit-status --raw-output \
              '.lockfile["dependency-count"] | select(type == "number" and . > 0)' \
              <<<"${audit_report}"
          )"
          echo "cargo-audit scanned ${dependency_count} dependencies"

      - name: Run cargo audit
        run: cargo audit --no-fetch --deny unsound --deny yanked --file Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Enforce dependency policy
        run: cargo deny --locked check

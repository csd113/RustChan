name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.1
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-validation

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          versions = [
              package["version"]
              for package in metadata["packages"]
              if package["name"] == "rustchan"
          ]
          if len(versions) != 1:
              raise SystemExit("expected exactly one rustchan package")
          print(versions[0])
          ')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}" >&2
            exit 1
          fi

      - name: Install cargo-deny
        uses: taiki-e/install-action@861a07ce7084f55488e375df125cdc99bba60eb7 # v2.87.23
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check all targets and features
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run focused regressions
        run: cargo test --locked --workspace --all-features --no-fail-fast

      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Enforce locked dependency policy
        run: cargo deny --locked check

  build:
    name: Build (${{ matrix.target }})
    needs: release-validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            binary_suffix: ""
            asset_suffix: macos-intel
          - target: aarch64-apple-darwin
            runner: macos-15
            binary_suffix: ""
            asset_suffix: macos-apple-silicon
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary_suffix: ""
            asset_suffix: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            binary_suffix: ""
            asset_suffix: linux-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_suffix: ".exe"
            asset_suffix: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify native executable and architecture
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.binary_suffix }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/rustchan-cli${SUFFIX}"
          "$binary" --version
          if [[ "$TARGET" == *apple-darwin ]]; then
            if [[ "$TARGET" == x86_64-* ]]; then arch=x86_64; else arch=arm64; fi
            file "$binary"
            lipo "$binary" -verify_arch "$arch"
            xcrun vtool -show-build "$binary"
          fi

      - name: Prepare release archive
        shell: bash
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUSTCHAN_TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail

          case "${RELEASE_TAG}" in
            v | *[!0-9A-Za-z._-]*)
              echo "Release tag '${RELEASE_TAG}' is not safe for archive names" >&2
              exit 1
              ;;
            v*)
              ;;
          esac

          case "${ASSET_SUFFIX}" in
            "" | *[!0-9A-Za-z._-]*)
              echo "Asset suffix '${ASSET_SUFFIX}' is not safe for archive names" >&2
              exit 1
              ;;
            *)
              ;;
          esac

          binary_path="target/${RUSTCHAN_TARGET}/release/rustchan-cli${BINARY_SUFFIX}"
          for required_path in "${binary_path}" README.md LICENSE; do
            if [ ! -f "${required_path}" ]; then
              echo "Required release file '${required_path}' is missing" >&2
              exit 1
            fi
          done

          rm -rf dist
          mkdir -p dist/package
          asset_basename="rustchan-cli-${RELEASE_TAG}-${ASSET_SUFFIX}"
          package_root="dist/package/${asset_basename}"

          mkdir -p "${package_root}"
          cp "${binary_path}" "${package_root}/rustchan-cli${BINARY_SUFFIX}"
          cp README.md LICENSE "${package_root}/"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            PACKAGE_ROOT="${package_root}" \
            ARCHIVE_PATH="dist/${asset_basename}.zip" \
              pwsh -NoLogo -NoProfile -Command \
                'Compress-Archive -Path (Join-Path $env:PACKAGE_ROOT "*") -DestinationPath $env:ARCHIVE_PATH -CompressionLevel Optimal'
          else
            chmod 0755 "${package_root}/rustchan-cli${BINARY_SUFFIX}"
            (
              cd "dist/package"
              zip -r -9 "../${asset_basename}.zip" "${asset_basename}"
            )
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustchan-cli-${{ matrix.asset_suffix }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  upgrade-verification:
    name: Verify binary upgrades
    needs: build
    uses: ./.github/workflows/upgrade.yml
    with:
      release_artifacts: true

  release:
    name: Prepare GitHub Release
    runs-on: ubuntu-24.04
    needs: [build, upgrade-verification]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout release changelog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          sections = Path("CHANGELOG.md").read_text().split("\n## ")
          matches = [section for section in sections[1:]
                     if section.splitlines()[0].split(" — ")[0] == f"RustChan {version}"]
          if len(matches) != 1:
              raise SystemExit(f"expected one changelog entry for {version}")
          notes = matches[0].split("\n", 1)[1].strip()
          if not notes:
              raise SystemExit("release notes must not be empty")
          Path("RELEASE_NOTES.md").write_text(notes + "\n")
          PY

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rustchan-cli-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=( *.zip )

          expected=(linux-arm64 linux-x86_64 macos-apple-silicon macos-intel windows-x86_64)
          if [ "${#archives[@]}" -ne "${#expected[@]}" ]; then
            echo "Expected all five platform archives" >&2
            exit 1
          fi
          for suffix in "${expected[@]}"; do
            test -f "rustchan-cli-${GITHUB_REF_NAME}-${suffix}.zip"
          done

          LC_ALL=C printf '%s\n' "${archives[@]}" \
            | sort \
            | while IFS= read -r archive; do
                sha256sum --binary "$archive"
              done > SHA256SUMS.txt

      - name: Verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt

      - name: Refuse to modify a published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          tag = urllib.parse.quote(os.environ["RELEASE_TAG"], safe="")
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"] + "/releases/tags/" + tag
          request = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json"})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  release = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise SystemExit("Could not verify existing release; publication stopped") from None
          else:
              if release.get("draft") is not True:
                  raise SystemExit("Refusing to alter an already published release")
          PY

      - name: Prepare draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*

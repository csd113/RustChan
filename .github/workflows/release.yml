name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

jobs:
  release-validation:
    name: Release validation
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release-validation

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          metadata = json.load(sys.stdin)
          versions = [
              package["version"]
              for package in metadata["packages"]
              if package["name"] == "rustchan"
          ]
          if len(versions) != 1:
              raise SystemExit("expected exactly one rustchan package")
          print(versions[0])
          ')"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${expected_tag}" >&2
            exit 1
          fi

      - name: Install cargo-deny
        uses: taiki-e/install-action@d865e9aac326f15b06ac52b57abb58cd0e3330e4 # cargo-deny
        with:
          tool: cargo-deny@0.19.0
          fallback: none

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Enforce locked dependency policy
        run: cargo deny --locked check

  build:
    name: Build (${{ matrix.target }})
    needs: release-validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            binary_suffix: ""
            asset_suffix: macos-apple-silicon
            use_cross: false
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary_suffix: ""
            asset_suffix: linux-x86_64
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary_suffix: ""
            asset_suffix: linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary_suffix: ".exe"
            asset_suffix: windows-x86_64
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.91.0
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: release
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build release binary
        shell: bash
        env:
          RUSTCHAN_TARGET: ${{ matrix.target }}
          USE_CROSS: ${{ matrix.use_cross }}
        run: |
          set -euo pipefail
          if [ "${USE_CROSS}" = "true" ]; then
            cross build --locked --release --target "${RUSTCHAN_TARGET}"
          else
            cargo build --locked --release --target "${RUSTCHAN_TARGET}"
          fi

      - name: Prepare release archive
        shell: bash
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          BINARY_SUFFIX: ${{ matrix.binary_suffix }}
          RELEASE_TAG: ${{ github.ref_name }}
          RUSTCHAN_TARGET: ${{ matrix.target }}
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail

          case "${RELEASE_TAG}" in
            v | *[!0-9A-Za-z._-]*)
              echo "Release tag '${RELEASE_TAG}' is not safe for archive names" >&2
              exit 1
              ;;
            v*)
              ;;
          esac

          case "${ASSET_SUFFIX}" in
            "" | *[!0-9A-Za-z._-]*)
              echo "Asset suffix '${ASSET_SUFFIX}' is not safe for archive names" >&2
              exit 1
              ;;
            *)
              ;;
          esac

          binary_path="target/${RUSTCHAN_TARGET}/release/rustchan-cli${BINARY_SUFFIX}"
          for required_path in "${binary_path}" README.md LICENSE; do
            if [ ! -f "${required_path}" ]; then
              echo "Required release file '${required_path}' is missing" >&2
              exit 1
            fi
          done

          rm -rf dist
          mkdir -p dist/package
          asset_basename="rustchan-cli-${RELEASE_TAG}-${ASSET_SUFFIX}"
          package_root="dist/package/${asset_basename}"

          mkdir -p "${package_root}"
          cp "${binary_path}" "${package_root}/rustchan-cli${BINARY_SUFFIX}"
          cp README.md LICENSE "${package_root}/"

          if [ "${RUNNER_OS}" = "Windows" ]; then
            PACKAGE_ROOT="${package_root}" \
            ARCHIVE_PATH="dist/${asset_basename}.zip" \
              pwsh -NoLogo -NoProfile -Command \
                'Compress-Archive -Path (Join-Path $env:PACKAGE_ROOT "*") -DestinationPath $env:ARCHIVE_PATH -CompressionLevel Optimal'
          else
            chmod 0755 "${package_root}/rustchan-cli${BINARY_SUFFIX}"
            (
              cd "dist/package"
              zip -r -9 "../${asset_basename}.zip" "${asset_basename}"
            )
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rustchan-cli-${{ matrix.asset_suffix }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: rustchan-cli-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          shopt -s nullglob
          archives=( *.zip )

          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives were downloaded" >&2
            exit 1
          fi

          LC_ALL=C printf '%s\n' "${archives[@]}" \
            | sort \
            | while IFS= read -r archive; do
                sha256sum --binary "$archive"
              done > SHA256SUMS.txt

      - name: Verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: release-assets/*

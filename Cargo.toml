[package]
name = "rustchan"
version = "1.3.0"
edition = "2021"
# axum 0.8 requires Rust 1.75; keep the package MSRV and cargo-msrv metadata
# in sync with the current dependency set.
rust-version = "1.90"
license = "MIT"
description = "Self-contained imageboard — single binary, zero runtime dependencies"
repository = "https://github.com/csd113/RustChan"
keywords = ["imageboard", "forum", "rust"]
categories = ["web-programming", "multimedia::images"]

# Keep `cargo-msrv` metadata aligned with `rust-version`.
[package.metadata]
msrv = "1.90"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
panic          = "abort"

[[bin]]
name = "rustchan-cli"
path = "src/main.rs"

[lib]
name  = "chan"
path  = "src/lib.rs"

[dependencies]
axum       = { version = "0.8.9",  features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower      = "0.5.3"
tower-http = { version = "0.6.11", features = ["fs", "set-header", "compression-full", "trace"] }
tokio      = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
captcha    = { version = "1.0.0", default-features = false }

rusqlite    = { version = "0.39.0", features = ["bundled", "backup"] }
r2d2        = "0.8.10"
r2d2_sqlite = "0.34.0"
time        = "0.3.47"

serde      = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
# toml 1.0: serde parsing is built-in, no feature flag needed.
toml  = "1.1.2"

argon2  = "0.5.3"
sha2    = "0.11.0"
subtle  = "2.6.1"
hex    = "0.4.3"
# rand_core 0.10 updates RustChan's direct RNG trait dependency, but the
# password-hash stack still carries rand_core 0.6 transitively for salt
# generation. Keep direct OS entropy reads on getrandom::SysRng and only use
# password-hash's re-exported rand_core where that older trait set is required.
rand_core = "0.10.1"
getrandom = { version = "0.4.2", features = ["sys_rng"] }

image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }

# EXIF orientation correction: read Orientation tag from JPEG uploads and
# apply the corresponding rotation before thumbnailing so that photos taken
# on phones display upright (4.1).
kamadak-exif = "0.6.1"

clap = { version = "4.6.1", features = ["derive"] }

uuid      = { version = "1.23.2", features = ["v4", "serde"] }
chrono    = { version = "0.4.45", features = ["serde"] }
dashmap      = "6.2.1"
parking_lot  = "0.12.5"
anyhow       = "1.0.102"
once_cell    = "1.21.4"
regex     = "1.12.3"
ipnet     = "2.12.0"

# zip 8: SimpleFileOptions and core ZipWriter/ZipArchive API unchanged.
# by_index(), start_file(), add_directory(), finish() all stable.
# Use file_names() iterator for name-only pre-flight scans (cleaner than
# by_index_raw which is now by_index_without_decompression in zip 8).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# ── HTTP client ────────────────────────────────────────────────────────────────
# reqwest for federation push (chan_refresh) and pull (chan_poll).
# default-features = false  →  prevents the default "native-tls" backend from
#                               being compiled in.
# rustls-no-provider keeps the build on the pure-Rust TLS stack and avoids
# pulling in native-tls/OpenSSL.
# Verify: cargo tree --edges features | grep -iE "openssl|native.tls"
reqwest = { version = "0.13.4", default-features = false, features = ["multipart", "json", "rustls-no-provider"] }

# Pin to patched version — fixes RUSTSEC-2026-0049 (CRL distribution point
# matching bug). Transitive dep via reqwest / arti-client.
rustls-webpki = "0.103.13"

tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender   = "0.2.5"

thiserror = "2.0.18"
tempfile  = "3.27.0"
libc      = "0.2.186"

# ── Tor / onion-service stack ──────────────────────────────────────────────────
# F-09: Use rustls throughout — native-tls would pull in OpenSSL as a
# transitive dep, causing a dynamic link against libssl/libcrypto and breaking
# cross-compilation to aarch64-unknown-linux-gnu.
#
# CRITICAL: `default-features = false` is REQUIRED on every arti crate.
# Cargo features are purely additive — without it, `arti-client`'s default
# feature set enables `native-tls` IN ADDITION TO `rustls`, pulling in
# openssl-sys even though rustls is also listed. The `rustls` feature alone
# does not prevent the native-tls default from activating.
#
# Post-change verification:
#   cargo tree --edges features | grep -iE "openssl|native.tls"   # expect nothing
#   cargo tree -i openssl-sys                                       # expect error: not found
arti-client = { version = "0.43.0", default-features = false, features = ["tokio", "rustls", "onion-service-service"] }

# tor-hsservice / tor-cell: also part of the arti workspace.  Their `full`
# default feature bundle can activate the native-tls TLS backend through
# tor-rtcompat.  Disable defaults; add back only what the build requires.
# If compilation fails with "feature X not found", re-add that feature here.
tor-hsservice = { version = "0.43.0", default-features = false }
tor-cell      = { version = "0.43.0", default-features = false }

futures       = "0.3.32"
sha3          = "0.12.0"
data-encoding = "2.11.0"

# ── TLS ───────────────────────────────────────────────────────────────────────
# rustls-pki-types: standalone PKI types crate split out of rustls 0.23+.
# Required directly by src/tls/mod.rs (CertificateDer, PrivateKeyDer, PemObject).
rustls-pki-types = "1.14.1"
tokio-rustls   = "0.26.4"
rustls         = { version = "0.23.40", features = ["ring"] }

# Optional — gated by Cargo features
rustls-acme    = { version = "0.15.3", features = ["tokio"], optional = true }
rcgen          = { version = "0.14.8", optional = true }
pem-rfc7468    = { version = "1.0.0", optional = true, features = ["std"] }
x509-cert      = { version = "0.2.5", optional = true }

# HTTPS listen integration for Axum (handles Static cert path)
axum-server    = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
hyper          = { version = "1.10.1", features = ["http1", "http2", "server"] }
hyper-util     = { version = "0.1.20", features = ["tokio", "server"] }

# ── Terminal UI ───────────────────────────────────────────────────────────────
# crossterm: required by src/server/console/ (wizard.rs, input.rs, mod.rs).
# Provides cross-platform terminal control (cursor, events, raw mode).
crossterm = "0.29.0"

[features]
default         = ["tls-self-signed"]
tls-self-signed = ["dep:rcgen", "dep:pem-rfc7468", "dep:x509-cert"]
tls-acme        = ["dep:rustls-acme"]

[target.'cfg(windows)'.dependencies]
# AllocConsole — used by the double-click / no-TTY re-launch guard in main.rs
# to attach a visible console window when the binary is started from Explorer.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

# ── Safety net ────────────────────────────────────────────────────────────────
# If a future dependency version change re-introduces openssl-sys as a
# transitive dep, the build will fail here with a clear error rather than
# silently linking a dynamic libssl.  Uncomment and point at a stub crate if
# `cargo tree -i openssl-sys` ever returns a result:
#
# [patch.crates-io]
# openssl-sys = { path = "patches/openssl-sys-stub" }

# Crate-wide Clippy policy: keep the dangerous footguns visible, but relax the lints that are noisy for large route, template, and DB-mapping modules.
# Individual exceptions are documented next to the code so maintainers can see why each one exists.
[lints.clippy]
too_many_arguments             = "allow"
manual_pattern_char_comparison = "allow"
# Keep panic-prone patterns visible while still allowing intentional, well-documented uses in tests and startup invariants.
unwrap_used                    = "warn"   # keep panic-on-bug paths visible without blocking the build
expect_used                    = "allow"  # intentional in tests and startup invariants where a panic would signal a bug
indexing_slicing               = "warn"   # direct indexing is still visible for review, but only when intentional
arithmetic_side_effects        = "allow"  # local math and display conversions are documented near the code
missing_errors_doc             = "allow"  # public error docs are useful, but not every internal helper needs them
doc_markdown                   = "allow"  # docs prioritize clarity over strict backtick style
doc_lazy_continuation          = "allow"  # don't require strict indentation for doc lists
items_after_statements         = "allow"  # some helpers stay inline for readability inside larger render/parse functions
wildcard_imports               = "allow"  # route modules use broad imports to keep handler files compact
uninlined_format_args          = "allow"  # older format strings are kept where they aid readability during staged cleanup

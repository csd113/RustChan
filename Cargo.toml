[package]
name = "rustchan"
version = "1.4.0"
edition = "2021"
# Arti 0.44 requires Rust 1.91; keep the package MSRV and cargo-msrv metadata
# in sync with the current dependency set.
rust-version.workspace = true
license = "MIT"
description = "Self-contained imageboard — single binary, zero runtime dependencies"
repository = "https://github.com/csd113/RustChan"
keywords = ["imageboard", "forum", "rust"]
categories = ["web-programming", "multimedia::images"]

# Keep `cargo-msrv` metadata aligned with `rust-version`.
[package.metadata]
msrv = "1.91"

[workspace]
resolver = "2"

[workspace.package]
rust-version = "1.91"

[profile.release]
opt-level      = 3
lto            = "thin"
codegen-units  = 1
strip          = true
panic          = "abort"

[[bin]]
name = "rustchan-cli"
path = "src/main.rs"

[lib]
name  = "chan"
path  = "src/lib.rs"

[dependencies]
axum       = { version = "0.8.9",  features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
tower      = "0.5.3"
tower-http = { version = "0.7.0", features = ["fs", "set-header", "compression-full", "trace"] }
tokio      = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
captcha    = { version = "1.0.0", default-features = false }

# Arti 0.44's tor-dirmgr requires rusqlite >=0.36,<0.40. Because rusqlite
# and libsqlite3-sys expose Cargo `links`, r2d2_sqlite 0.35/rusqlite 0.40
# cannot coexist in the same graph. These are the newest Arti-compatible pair.
rusqlite    = { version = "0.39.0", features = ["bundled", "backup"] }
r2d2        = "0.8.10"
r2d2_sqlite = "0.34.0"
time        = "0.3.54"

serde      = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# toml 1.0: serde parsing is built-in, no feature flag needed.
toml  = "1.1.4"

argon2  = "0.5.3"
sha2    = "0.11.0"
subtle  = "2.6.1"
hex    = "0.4.3"
# rand_core 0.10 updates RustChan's direct RNG trait dependency, but the
# password-hash stack still carries rand_core 0.6 transitively for salt
# generation. Keep direct OS entropy reads on getrandom::SysRng and only use
# password-hash's re-exported rand_core where that older trait set is required.
rand_core = "0.10.1"
getrandom = { version = "0.4.3", features = ["sys_rng"] }

image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff", "ico"] }

# EXIF orientation correction: read Orientation tag from JPEG uploads and
# apply the corresponding rotation before thumbnailing so that photos taken
# on phones display upright (4.1).
kamadak-exif = "0.6.1"

clap = { version = "4.6.4", features = ["derive"] }

uuid      = { version = "1.24.0", features = ["v4", "serde"] }
chrono    = { version = "0.4.45", features = ["serde"] }
dashmap      = "6.2.1"
parking_lot  = "0.12.5"
anyhow       = "1.0.104"
regex     = "1.13.1"
ipnet     = "2.12.0"

# zip 8: SimpleFileOptions and core ZipWriter/ZipArchive API unchanged.
# by_index(), start_file(), add_directory(), finish() all stable.
# Use file_names() iterator for name-only pre-flight scans (cleaner than
# by_index_raw which is now by_index_without_decompression in zip 8).
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# ── HTTP client ────────────────────────────────────────────────────────────────
# reqwest for federation push (chan_refresh) and pull (chan_poll).
# default-features = false  →  prevents the default "native-tls" backend from
#                               being compiled in.
# rustls-no-provider keeps the build on the pure-Rust TLS stack and avoids
# pulling in native-tls/OpenSSL.
# Verify: cargo tree --edges features | grep -iE "openssl|native.tls"
reqwest = { version = "0.13.4", default-features = false, features = ["multipart", "json", "rustls-no-provider"] }

# Keep a direct lower bound on the RUSTSEC-2026-0049 CRL
# distribution-point fix. The crate is consumed transitively through rustls;
# this declaration intentionally constrains future lockfile regeneration.
rustls-webpki = { version = "0.103.13", default-features = false }

tracing            = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
tracing-appender   = "0.2.5"

thiserror = "2.0.19"
tempfile  = "3.27.0"

# ── Tor / onion-service stack ──────────────────────────────────────────────────
# F-09: Use rustls throughout — native-tls would pull in OpenSSL as a
# transitive dep, causing a dynamic link against libssl/libcrypto and breaking
# cross-compilation to aarch64-unknown-linux-gnu.
#
# CRITICAL: `default-features = false` is REQUIRED on every arti crate.
# Cargo features are purely additive — without it, `arti-client`'s default
# feature set enables `native-tls` IN ADDITION TO `rustls`, pulling in
# openssl-sys even though rustls is also listed. The `rustls` feature alone
# does not prevent the native-tls default from activating.
#
# Post-change verification:
#   cargo tree --edges features | grep -iE "openssl|native.tls"   # expect nothing
#   cargo tree -i openssl-sys                                       # expect error: not found
# Arti 0.45.0 requires Rust 1.91 and makes its stable congestion control a
# default. Enable flowctl-cc explicitly because defaults stay disabled for TLS.
arti-client = { version = "0.45.0", default-features = false, features = ["tokio", "rustls", "onion-service-service", "flowctl-cc"] }

# tor-hsservice / tor-cell: also part of the arti workspace.  Their `full`
# default feature bundle can activate the native-tls TLS backend through
# tor-rtcompat.  Disable defaults; add back only what the build requires.
# If compilation fails with "feature X not found", re-add that feature here.
tor-hsservice = { version = "0.45.0", default-features = false }
tor-cell      = { version = "0.45.0", default-features = false }

futures       = "0.3.33"
sha3          = "0.12.0"
data-encoding = "2.11.0"

# ── TLS ───────────────────────────────────────────────────────────────────────
# rustls-pki-types: standalone PKI types crate split out of rustls 0.23+.
# Required directly by src/tls/mod.rs (CertificateDer, PrivateKeyDer, PemObject).
rustls-pki-types = "1.15.1"
# RustChan installs rustls's ring provider explicitly at startup. Keep every
# TLS consumer on that provider instead of also compiling the unused aws-lc-rs
# defaults; logging, TLS 1.2, and the system-independent root set stay enabled.
tokio-rustls   = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12"] }
rustls         = { version = "0.23.43", default-features = false, features = ["logging", "ring", "std", "tls12"] }

# Optional — gated by Cargo features
rustls-acme    = { version = "0.15.3", default-features = false, features = ["ring", "tls12", "tokio", "webpki-roots"], optional = true }
rcgen          = { version = "0.14.8", optional = true }
pem-rfc7468    = { version = "1.0.0", optional = true, features = ["std"] }
x509-cert      = { version = "0.3.0", optional = true }

# HTTPS listen integration for Axum (handles Static cert path)
axum-server    = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
hyper          = { version = "1.11.0", features = ["http1", "http2", "server"], optional = true }
hyper-util     = { version = "0.1.20", features = ["tokio", "server"] }

# ── Terminal UI ───────────────────────────────────────────────────────────────
# crossterm: required by src/server/console/ (wizard.rs, input.rs, mod.rs).
# Provides cross-platform terminal control (cursor, events, raw mode).
crossterm = "0.29.0"

[target.'cfg(unix)'.dependencies]
# Safe in-process filesystem-capacity queries for upload disk-space preflights.
rustix = { version = "1.1.4", features = ["fs"] }

[features]
default         = ["tls-self-signed"]
tls-self-signed = ["dep:rcgen", "dep:pem-rfc7468", "dep:x509-cert"]
tls-acme        = ["dep:hyper", "dep:rustls-acme"]

# ── Safety net ────────────────────────────────────────────────────────────────
# If a future dependency version change re-introduces openssl-sys as a
# transitive dep, the build will fail here with a clear error rather than
# silently linking a dynamic libssl.  Uncomment and point at a stub crate if
# `cargo tree -i openssl-sys` ever returns a result:
#
# [patch.crates-io]
# openssl-sys = { path = "patches/openssl-sys-stub" }

[lints]
workspace = true

[workspace.lints.rust]
warnings = { level = "deny", priority = -3 }
future_incompatible = { level = "deny", priority = -2 }
rust_2018_idioms = { level = "deny", priority = -2 }
rust_2024_compatibility = { level = "deny", priority = -2 }
unused = { level = "deny", priority = -2 }

unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
non_ascii_idents = "deny"
unreachable_pub = "deny"
unused_lifetimes = "deny"
unused_qualifications = "deny"
let_underscore_drop = "deny"

# This rustc lint can report false positives for dependencies shared across
# library, binary, example, test, benchmark, and feature-specific targets.
# Keep it visible, but do not force fake imports or dependency distortions.
unused_crate_dependencies = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -3 }
pedantic = { level = "deny", priority = -2 }
cargo = { level = "deny", priority = -2 }

# This can represent unavoidable transitive version splits, especially in
# a dependency graph as large as Arti's. Audit every report without making
# unavoidable upstream duplication a hard failure.
multiple_crate_versions = "warn"

# Panic-driven control flow.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"

# Debugging output must not enter production code accidentally.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Unsafe-code safeguards remain documented even though unsafe Rust is
# forbidden globally.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"

# Suppressions must be narrow, intentional, and documented.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Numeric conversions must be explicit and reviewed.
as_conversions = "deny"
cast_lossless = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
cast_ptr_alignment = "deny"
cast_sign_loss = "deny"
char_lit_as_u8 = "deny"
fn_to_numeric_cast_any = "deny"
lossy_float_literal = "deny"

# Avoid unchecked indexing and UTF-8 string slicing.
indexing_slicing = "deny"
string_slice = "deny"

# Ownership and resource-management restrictions.
clone_on_ref_ptr = "deny"
mem_forget = "deny"
rc_buffer = "deny"
rc_mutex = "deny"

# Documentation, testing, and maintainability.
missing_docs_in_private_items = "deny"
missing_assert_message = "deny"
large_include_file = "deny"
verbose_file_reads = "deny"
wildcard_dependencies = "deny"
